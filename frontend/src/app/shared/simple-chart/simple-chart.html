<div class="simple-chart">
  <p class="simple-chart__title">{{ data().title }}</p>

  @if (data().chartType === 'bar') {
    <div class="simple-chart__bars">
      @for (row of barRows(); track $index) {
        <div class="simple-chart__row">
          <span class="simple-chart__row-label" [title]="row.label"><bdi>{{ row.label }}</bdi></span>
          <span class="simple-chart__track">
            <span class="simple-chart__fill" [style.width.%]="row.percent"></span>
          </span>
          <span class="simple-chart__row-value">{{ row.valueLabel }}</span>
        </div>
      }
    </div>
  } @else {
    <div class="simple-chart__pie-row">
      <svg class="simple-chart__svg simple-chart__svg--pie" viewBox="0 0 180 180" preserveAspectRatio="xMidYMid meet">
        @if (pieChart().isSingleSlice) {
          <circle [attr.cx]="pieChart().cx" [attr.cy]="pieChart().cy" [attr.r]="pieChart().r" [style.fill]="pieChart().singleColor" />
        } @else {
          @for (slice of pieChart().slices; track $index) {
            <path [attr.d]="slice.path" [style.fill]="slice.color" />
          }
        }
      </svg>

      <ul class="simple-chart__legend">
        @for (slice of pieChart().slices; track $index) {
          <li class="simple-chart__legend-item">
            <span class="simple-chart__legend-swatch" [style.background]="slice.color"></span>
            <span class="simple-chart__legend-label">{{ slice.label }}</span>
            <span class="simple-chart__legend-value">{{ slice.percent }}%</span>
          </li>
        }
      </ul>
    </div>
  }
</div>
