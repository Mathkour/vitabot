server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must cover MAX_MEDIA_UPLOAD_SIZE in main.py
    client_max_body_size 200m;

    # Requests arrive from the AWS load balancer, which appends the real client
    # IP as the last X-Forwarded-For entry. Earlier entries are client-supplied.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location /api/ {
        # Resolved per request so recreating the backend container doesn't
        # leave nginx on a stale IP, using Docker's embedded DNS
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended, so uvicorn can't read a spoofed client IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # LLM answers can be slow
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
